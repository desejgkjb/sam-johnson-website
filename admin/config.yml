backend:
  name: git-gateway
  branch: main

# Drafts are saved and previewed before going live
publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:
  - name: "content"
    label: "Website Content"
    files:
      - name: "main"
        label: "All Content"
        file: "_data/content.json"
        format: json
        fields:

          # ─── HERO ────────────────────────────────────────────
          - label: "⭐ Hero Section"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Main heading", name: "heading", widget: "string" }
              - { label: "Subheading", name: "subheading", widget: "text" }
              - { label: "Hero photo", name: "photo", widget: "image", required: false, hint: "Full-bleed action photo of Sam. Upload a new file or pick from the media library to replace." }
              - label: "Hero photo — fit"
                name: "photo_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the area (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Hero photo — crop focus"
                name: "photo_position"
                widget: "select"
                required: false
                default: "center"
                hint: "Which part of the photo stays visible when it gets cropped"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Hero video (optional)", name: "video", widget: "file", required: false, hint: "MP4 video, ideally under 20 MB. When set, it plays as the hero background; the hero photo stays as the fallback for slow connections. Remove the file to go back to the photo." }
              - { label: "Video autoplays", name: "video_autoplay", widget: "boolean", required: false, default: true, hint: "Autoplaying videos are always muted (browser rule)" }
              - { label: "Video loops", name: "video_loop", widget: "boolean", required: false, default: true }
              - { label: "Video muted", name: "video_muted", widget: "boolean", required: false, default: true }
              - label: "Hero section height"
                name: "photo_height"
                widget: "select"
                required: false
                default: "88vh"
                options:
                  - { label: "Standard (88% of screen)", value: "88vh" }
                  - { label: "Full screen", value: "100vh" }
                  - { label: "Compact (70% of screen)", value: "70vh" }
              - { label: "Attribution line", name: "attribution", widget: "string" }

          # ─── ABOUT (HOMEPAGE TEASER) ──────────────────────────
          - label: "📖 About (Homepage teaser)"
            name: "about_teaser"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text", name: "body", widget: "text" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Natural light, warm grading. Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          # ─── ABOUT (FULL PAGE) ────────────────────────────────
          - label: "📖 About (Full page)"
            name: "about_full"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Origin story heading", name: "origin_heading", widget: "string" }
              - { label: "Origin story body (HTML)", name: "origin_body", widget: "markdown" }
              - { label: "Pull quote", name: "quote", widget: "string" }
              - { label: "Quote attribution", name: "quote_cite", widget: "string" }

          # ─── STATS ────────────────────────────────────────────
          - label: "📊 Stats"
            name: "stats"
            widget: "list"
            collapsed: true
            label_singular: "Stat"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

          # ─── PROJECTS ─────────────────────────────────────────
          - label: "🗂 Projects"
            name: "projects"
            widget: "list"
            collapsed: true
            label_singular: "Project"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date / Location", name: "meta", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          # ─── GOVERNANCE ───────────────────────────────────────
          - label: "🏛 Governance"
            name: "governance"
            widget: "list"
            collapsed: true
            label_singular: "Governance entry"
            hint: "Board positions, advisory roles, committees. Drag entries to reorder them."
            fields:
              - { label: "Role / Title", name: "title", widget: "string", hint: "e.g. Board Member, Trustee, Chair" }
              - { label: "Organisation / Years", name: "meta", widget: "string", hint: "e.g. Organisation name · 2020 – present" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string", required: false, hint: "e.g. Governance, Advisory, Current" }
              - { label: "Photo (optional)", name: "image", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          # ─── TIMELINE ─────────────────────────────────────────
          - label: "📅 Timeline"
            name: "timeline"
            widget: "list"
            collapsed: true
            label_singular: "Timeline item"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag (optional)", name: "chip", widget: "string", required: false }

          # ─── TESTIMONIALS ─────────────────────────────────────
          - label: "💬 Testimonials"
            name: "testimonials"
            widget: "list"
            collapsed: true
            label_singular: "Testimonial"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author name", name: "author", widget: "string" }
              - { label: "Title & Organisation", name: "title", widget: "string" }

          # ─── AWARDS ───────────────────────────────────────────
          - label: "🏆 Awards"
            name: "awards"
            widget: "list"
            collapsed: true
            label_singular: "Award"
            fields:
              - { label: "Award name", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }

          # ─── RECOGNITION STRIP (homepage "Recognised by") ─────
          - label: "🎖 Recognition strip"
            name: "recognition"
            widget: "list"
            collapsed: true
            label_singular: "Recognition"
            hint: "The award/organisation logos under the hero. Drag to reorder."
            fields:
              - { label: "Recognition title", name: "title", widget: "string", hint: "e.g. Young New Zealander of the Year" }
              - { label: "Organisation / award logo", name: "logo", widget: "image", required: false, hint: "PNG or SVG with transparent background works best. Shown at a consistent height." }
              - { label: "Short description (optional)", name: "description", widget: "string", required: false }
              - { label: "Link (optional)", name: "url", widget: "string", required: false, hint: "e.g. the award or organisation website" }

          # ─── FEATURED IN (media logos) ────────────────────────
          - label: "📰 Featured in (media)"
            name: "press"
            widget: "list"
            collapsed: true
            label_singular: "Media feature"
            hint: "Media outlets that have featured Sam. Drag to reorder."
            fields:
              - { label: "Outlet name", name: "name", widget: "string" }
              - { label: "Outlet logo", name: "logo", widget: "image", required: false, hint: "Shown greyscale, full colour on hover. Without a logo the name shows as text." }
              - { label: "Show name next to logo", name: "show_name", widget: "boolean", required: false, default: false }
              - label: "Logo size"
                name: "logo_height"
                widget: "select"
                required: false
                default: "36"
                options:
                  - { label: "Small (28px)", value: "28" }
                  - { label: "Medium (36px)", value: "36" }
                  - { label: "Large (48px)", value: "48" }
              - { label: "Link to article / feature (optional)", name: "url", widget: "string", required: false }

          # ─── PAGE COPY ────────────────────────────────────────
          - label: "📄 Page copy"
            name: "pages"
            widget: "object"
            collapsed: true
            fields:

              - label: "Home page"
                name: "home"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Pull-quote text", name: "quote_band_text", widget: "string" }
                  - { label: "Pull-quote attribution", name: "quote_band_cite", widget: "string" }
                  - { label: "Projects section heading", name: "projects_heading", widget: "string" }
                  - { label: "Speaking section heading", name: "speaking_heading", widget: "string" }
                  - { label: "Speaking section body", name: "speaking_body", widget: "text" }
                  - label: "Speaking topics (chips)"
                    name: "speaking_topics"
                    widget: "list"
                    field: { label: "Topic", name: "item", widget: "string" }
                  - { label: "Testimonials section heading", name: "testimonials_heading", widget: "string" }
                  - { label: "Newsletter heading", name: "newsletter_heading", widget: "string" }
                  - { label: "Newsletter body", name: "newsletter_body", widget: "text" }

              - label: "About page"
                name: "about"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Values section heading", name: "values_heading", widget: "string" }
                  - label: "Values (belief cards)"
                    name: "values"
                    widget: "list"
                    label_singular: "Value"
                    fields:
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Body text", name: "body", widget: "text" }
                  - { label: "CTA heading", name: "cta_heading", widget: "string" }
                  - { label: "CTA body", name: "cta_body", widget: "text" }

              - label: "Governance / Projects page"
                name: "projects"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Page heading", name: "heading", widget: "string" }
                  - { label: "Page subheading", name: "subheading", widget: "text" }
                  - { label: "Governance section heading", name: "governance_heading", widget: "string" }
                  - { label: "Governance section intro", name: "governance_intro", widget: "text", required: false }
                  - { label: "Projects section heading", name: "projects_heading", widget: "string" }
                  - { label: "Projects section intro", name: "projects_intro", widget: "text", required: false }
                  - { label: "CTA heading", name: "cta_heading", widget: "string" }
                  - { label: "CTA body", name: "cta_body", widget: "text" }

              - label: "Experience page"
                name: "experience"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Page heading", name: "heading", widget: "string" }
                  - { label: "Page subheading", name: "subheading", widget: "text" }
                  - { label: "Awards section heading", name: "awards_heading", widget: "string" }
                  - { label: "CTA heading", name: "cta_heading", widget: "string" }
                  - { label: "CTA body", name: "cta_body", widget: "text" }

              - label: "Contact page"
                name: "contact"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Page heading", name: "heading", widget: "string" }
                  - { label: "Page subheading", name: "subheading", widget: "text" }
                  - { label: "Aside heading", name: "aside_heading", widget: "string" }
                  - { label: "Response time note", name: "aside_response_time", widget: "string" }

          # ─── SETTINGS ─────────────────────────────────────────
          - label: "⚙️ Settings"
            name: "settings"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Your name (site-wide)", name: "name", widget: "string" }
              - { label: "CTA button label", name: "cta_label", widget: "string", hint: "e.g. Book Sam to Speak — appears on all CTA buttons site-wide" }
              - { label: "Contact email", name: "email", widget: "string", hint: "Shown in footer and contact page. Include domain only, e.g. hello@samjohnson.co.nz" }
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
              - { label: "SVA Website URL", name: "sva_url", widget: "string" }
              - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
