backend:
  name: git-gateway
  branch: main

# Drafts are saved and previewed before going live
publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:

  # ════════════════════════════════════════════════════════
  # 🏠 HOME PAGE — everything on the homepage, top to bottom
  # ════════════════════════════════════════════════════════
  - name: "home"
    label: "🏠 Home page"
    description: "Everything on the homepage, in the order it appears on the page. Testimonials have their own section in the sidebar."
    files:
      - name: "home"
        label: "Home page content"
        file: "_data/home.json"
        format: json
        fields:

          - label: "1 · Hero (top banner)"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Main heading", name: "heading", widget: "string" }
              - { label: "Subheading", name: "subheading", widget: "text" }
              - { label: "Hero photo", name: "photo", widget: "image", required: false, hint: "Full-bleed action photo of Sam. Upload a new file or pick from the media library to replace." }
              - { label: "Hero video (optional)", name: "video", widget: "file", required: false, hint: "MP4 video, ideally under 20 MB. When set, it plays as the hero background; the hero photo stays as the fallback for slow connections. Remove the file to go back to the photo." }
              - { label: "Video autoplays", name: "video_autoplay", widget: "boolean", required: false, default: true, hint: "Autoplaying videos are always muted (browser rule)" }
              - { label: "Video loops", name: "video_loop", widget: "boolean", required: false, default: true }
              - { label: "Video muted", name: "video_muted", widget: "boolean", required: false, default: true }
              - label: "Hero photo — fit"
                name: "photo_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the area (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Hero photo — crop focus"
                name: "photo_position"
                widget: "select"
                required: false
                default: "center"
                hint: "Which part of the photo stays visible when it gets cropped"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - label: "Hero section height"
                name: "photo_height"
                widget: "select"
                required: false
                default: "88vh"
                options:
                  - { label: "Standard (88% of screen)", value: "88vh" }
                  - { label: "Full screen", value: "100vh" }
                  - { label: "Compact (70% of screen)", value: "70vh" }
              - { label: "Attribution line (under the button)", name: "attribution", widget: "string" }

          - label: "2 · Recognised by (award logos strip)"
            name: "recognition"
            widget: "list"
            collapsed: true
            label_singular: "Recognition"
            hint: "The award/organisation logos under the hero. Drag to reorder."
            fields:
              - { label: "Recognition title", name: "title", widget: "string", hint: "e.g. Young New Zealander of the Year" }
              - { label: "Organisation / award logo", name: "logo", widget: "image", required: false, hint: "PNG or SVG with transparent background works best. Shown at a consistent height." }
              - { label: "Short description (optional)", name: "description", widget: "string", required: false }
              - { label: "Link (optional)", name: "url", widget: "string", required: false, hint: "e.g. the award or organisation website" }

          - label: "3 · About teaser (short intro + portrait)"
            name: "about_teaser"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text", name: "body", widget: "text" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "4 · Featured in (media logos strip)"
            name: "press"
            widget: "list"
            collapsed: true
            label_singular: "Media feature"
            hint: "Media outlets that have featured Sam. Drag to reorder."
            fields:
              - { label: "Outlet name", name: "name", widget: "string" }
              - { label: "Outlet logo", name: "logo", widget: "image", required: false, hint: "Shown greyscale, full colour on hover. Without a logo the name shows as text." }
              - { label: "Show name next to logo", name: "show_name", widget: "boolean", required: false, default: false }
              - label: "Logo size"
                name: "logo_height"
                widget: "select"
                required: false
                default: "36"
                options:
                  - { label: "Small (28px)", value: "28" }
                  - { label: "Medium (36px)", value: "36" }
                  - { label: "Large (48px)", value: "48" }
              - { label: "Link to article / feature (optional)", name: "url", widget: "string", required: false }

          - label: "5 · Section headings & copy (rest of the homepage)"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Pull-quote band — quote", name: "quote_band_text", widget: "string" }
              - { label: "Pull-quote band — attribution", name: "quote_band_cite", widget: "string" }
              - { label: "Featured work — section heading", name: "projects_heading", widget: "string", hint: "The project cards themselves are edited under 🏛 Governance / Projects page" }
              - { label: "Speaking — heading", name: "speaking_heading", widget: "string" }
              - { label: "Speaking — body", name: "speaking_body", widget: "text" }
              - label: "Speaking — topic chips"
                name: "speaking_topics"
                widget: "list"
                field: { label: "Topic", name: "item", widget: "string" }
              - { label: "Testimonials — section heading", name: "testimonials_heading", widget: "string", hint: "The testimonials themselves are edited under 💬 Testimonials" }
              - { label: "Newsletter — heading", name: "newsletter_heading", widget: "string" }
              - { label: "Newsletter — body", name: "newsletter_body", widget: "text" }

  # ════════════════════════════════════════════════════════
  # 📖 ABOUT PAGE
  # ════════════════════════════════════════════════════════
  - name: "about"
    label: "📖 About page"
    description: "Everything on the About page: heading, bio, portrait, quote and the three value cards."
    files:
      - name: "about"
        label: "About page content"
        file: "_data/about.json"
        format: json
        fields:

          - label: "1 · Page header, bio & portrait"
            name: "about_full"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Origin story heading", name: "origin_heading", widget: "string" }
              - { label: "Origin story body (HTML)", name: "origin_body", widget: "markdown" }
              - { label: "Pull quote", name: "quote", widget: "string" }
              - { label: "Quote attribution", name: "quote_cite", widget: "string" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "2 · Values section & page CTA"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Values — section heading", name: "values_heading", widget: "string" }
              - label: "Values — belief cards"
                name: "values"
                widget: "list"
                label_singular: "Value"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body text", name: "body", widget: "text" }
              - { label: "Bottom CTA — heading", name: "cta_heading", widget: "string" }
              - { label: "Bottom CTA — body", name: "cta_body", widget: "text" }

  # ════════════════════════════════════════════════════════
  # 🏛 GOVERNANCE / PROJECTS PAGE
  # ════════════════════════════════════════════════════════
  - name: "governance_projects"
    label: "🏛 Governance / Projects page"
    description: "The Governance / Projects page: governance entries, project cards (the first three also appear on the homepage), stat band and page copy."
    files:
      - name: "governance_projects"
        label: "Governance / Projects content"
        file: "_data/governance-projects.json"
        format: json
        fields:

          - label: "1 · Governance entries"
            name: "governance"
            widget: "list"
            collapsed: false
            label_singular: "Governance entry"
            hint: "Board positions, advisory roles, committees. Drag entries to reorder them. The top 4 show by default — the rest sit behind a 'View all governance' button."
            fields:
              - { label: "Role / Title", name: "title", widget: "string", hint: "e.g. Board Member, Trustee, Chair" }
              - { label: "Featured (show in the top group)", name: "featured", widget: "boolean", required: false, default: false, hint: "Featured entries float to the top of the list. The first 4 are visible before 'View all'." }
              - { label: "Organisation / Years", name: "meta", widget: "string", hint: "e.g. Organisation name · 2020 – present" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string", required: false, hint: "e.g. Governance, Advisory, Current" }
              - { label: "Photo (optional)", name: "image", widget: "image", required: false }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "2 · Project cards"
            name: "projects"
            widget: "list"
            collapsed: true
            label_singular: "Project"
            hint: "The first project is the large featured card; the first three also appear on the homepage. The top 5 show by default — the rest sit behind a 'View all projects' button. Drag to reorder."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Featured (show in the top group)", name: "featured", widget: "boolean", required: false, default: false, hint: "Featured projects float to the top of the list. The first 5 are visible before 'View all'." }
              - { label: "Date / Location", name: "meta", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "3 · Stat band (numbers strip)"
            name: "stats"
            widget: "list"
            collapsed: true
            label_singular: "Stat"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

          - label: "4 · Page headings & copy"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Governance — section heading", name: "governance_heading", widget: "string" }
              - { label: "Governance — section intro", name: "governance_intro", widget: "text", required: false }
              - { label: "Projects — section heading", name: "projects_heading", widget: "string" }
              - { label: "Projects — section intro", name: "projects_intro", widget: "text", required: false }
              - { label: "Bottom CTA — heading", name: "cta_heading", widget: "string" }
              - { label: "Bottom CTA — body", name: "cta_body", widget: "text" }

  # ════════════════════════════════════════════════════════
  # 📅 EXPERIENCE PAGE
  # ════════════════════════════════════════════════════════
  - name: "experience"
    label: "📅 Experience page"
    description: "The Experience page: career timeline, awards band and page copy."
    files:
      - name: "experience"
        label: "Experience page content"
        file: "_data/experience.json"
        format: json
        fields:

          - label: "1 · Career timeline"
            name: "timeline"
            widget: "list"
            collapsed: false
            label_singular: "Timeline item"
            hint: "Drag items to reorder them on the timeline."
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag (optional)", name: "chip", widget: "string", required: false }

          - label: "2 · Recognition & awards showcase"
            name: "awards"
            widget: "list"
            collapsed: true
            label_singular: "Recognition"
            hint: "Premium recognition cards. Drag to reorder. Upload the official organisation logo for each award — PNG/SVG with transparent background works best."
            fields:
              - { label: "Award name", name: "title", widget: "string" }
              - { label: "Organisation logo", name: "logo", widget: "image", required: false, hint: "Official logo of the awarding organisation. Shown above the award name." }
              - label: "Logo size"
                name: "logo_size"
                widget: "select"
                required: false
                default: "56"
                options:
                  - { label: "Small (40px)", value: "40" }
                  - { label: "Medium (56px)", value: "56" }
                  - { label: "Large (72px)", value: "72" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Year received", name: "year", widget: "string", required: false, hint: "e.g. 2012 — leave blank if unconfirmed" }
              - { label: "Link (optional)", name: "url", widget: "string", required: false, hint: "Award page or announcement — adds a 'Learn more' to the card" }

          - label: "3 · Page headings & copy"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Awards — section heading", name: "awards_heading", widget: "string" }
              - { label: "Bottom CTA — heading", name: "cta_heading", widget: "string" }
              - { label: "Bottom CTA — body", name: "cta_body", widget: "text" }

  # ════════════════════════════════════════════════════════
  # ✉️ CONTACT PAGE
  # ════════════════════════════════════════════════════════
  - name: "contact"
    label: "✉️ Contact page"
    description: "The Contact page headings and side panel. The email address itself lives in ⚙️ Site settings."
    files:
      - name: "contact"
        label: "Contact page content"
        file: "_data/contact.json"
        format: json
        fields:
          - label: "Page headings & copy"
            name: "copy"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Side panel — heading", name: "aside_heading", widget: "string" }
              - { label: "Side panel — response time note", name: "aside_response_time", widget: "string" }

  # ════════════════════════════════════════════════════════
  # 💬 TESTIMONIALS (homepage carousel)
  # ════════════════════════════════════════════════════════
  - name: "testimonials"
    label: "💬 Testimonials"
    description: "The testimonial carousel on the homepage. Add as many as you like — drag to reorder."
    files:
      - name: "testimonials"
        label: "Testimonials"
        file: "_data/testimonials.json"
        format: json
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            collapsed: false
            label_singular: "Testimonial"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Author name", name: "author", widget: "string" }
              - { label: "Title & Organisation", name: "title", widget: "string" }

  # ════════════════════════════════════════════════════════
  # ⚙️ SITE SETTINGS (name, contact, links — used everywhere)
  # ════════════════════════════════════════════════════════
  - name: "settings"
    label: "⚙️ Site settings"
    description: "Site-wide details used on every page: name, button label, email and social links."
    files:
      - name: "settings"
        label: "Site settings"
        file: "_data/settings.json"
        format: json
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Your name (site-wide)", name: "name", widget: "string" }
              - { label: "CTA button label", name: "cta_label", widget: "string", hint: "e.g. Book Sam to Speak — appears on all CTA buttons site-wide" }
              - { label: "Contact email", name: "email", widget: "string", hint: "Shown in footer and contact page" }
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
              - { label: "SVA Website URL", name: "sva_url", widget: "string" }
              - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
