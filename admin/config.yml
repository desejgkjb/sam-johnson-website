backend:
  name: git-gateway
  branch: main

# Drafts are saved and previewed before going live
publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

collections:

  # ════════════════════════════════════════════════════════
  # 🏠 HOME PAGE — everything on the homepage, top to bottom
  # ════════════════════════════════════════════════════════
  - name: "home"
    label: "🏠 Home page"
    description: "Everything on the homepage, in the order it appears on the page. Testimonials have their own section in the sidebar."
    files:
      - name: "home"
        label: "Home page content"
        file: "_data/home.json"
        format: json
        fields:

          - label: "1 · Hero (top banner)"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Main heading", name: "heading", widget: "string" }
              - { label: "Subheading", name: "subheading", widget: "text" }
              - { label: "Hero photo", name: "photo", widget: "image", required: false, hint: "Full-bleed action photo of Sam. Upload a new file or pick from the media library to replace." }
              - { label: "Hero video (optional)", name: "video", widget: "file", required: false, hint: "MP4 video, ideally under 20 MB. When set, it plays as the hero background; the hero photo stays as the fallback for slow connections. Remove the file to go back to the photo." }
              - { label: "Video autoplays", name: "video_autoplay", widget: "boolean", required: false, default: true, hint: "Autoplaying videos are always muted (browser rule)" }
              - { label: "Video loops", name: "video_loop", widget: "boolean", required: false, default: true }
              - { label: "Video muted", name: "video_muted", widget: "boolean", required: false, default: true }
              - label: "Hero photo — fit"
                name: "photo_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the area (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Hero photo — crop focus"
                name: "photo_position"
                widget: "select"
                required: false
                default: "center"
                hint: "Which part of the photo stays visible when it gets cropped"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - label: "Hero section height"
                name: "photo_height"
                widget: "select"
                required: false
                default: "88vh"
                options:
                  - { label: "Standard (88% of screen)", value: "88vh" }
                  - { label: "Full screen", value: "100vh" }
                  - { label: "Compact (70% of screen)", value: "70vh" }
              - { label: "Attribution line (under the button)", name: "attribution", widget: "string" }

          - label: "2 · Recognised by (award logos strip)"
            name: "recognition"
            widget: "list"
            collapsed: true
            label_singular: "Recognition"
            hint: "The award/organisation logos under the hero. Drag to reorder."
            fields:
              - { label: "Recognition title", name: "title", widget: "string", hint: "e.g. Young New Zealander of the Year" }
              - { label: "Organisation / award logo", name: "logo", widget: "image", required: false, hint: "PNG or SVG with transparent background works best. Shown at a consistent height." }
              - { label: "Short description (optional)", name: "description", widget: "string", required: false }
              - { label: "Link (optional)", name: "url", widget: "string", required: false, hint: "e.g. the award or organisation website" }

          - label: "3 · About teaser (short intro + portrait)"
            name: "about_teaser"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body text", name: "body", widget: "text" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "4 · Featured in (media logos strip)"
            name: "press"
            widget: "list"
            collapsed: true
            label_singular: "Media feature"
            hint: "Media outlets that have featured Sam. Drag to reorder."
            fields:
              - { label: "Outlet name", name: "name", widget: "string" }
              - { label: "Outlet logo", name: "logo", widget: "image", required: false, hint: "Shown greyscale, full colour on hover. Without a logo the name shows as text." }
              - { label: "Show name next to logo", name: "show_name", widget: "boolean", required: false, default: false }
              - label: "Logo size"
                name: "logo_height"
                widget: "select"
                required: false
                default: "36"
                options:
                  - { label: "Small (28px)", value: "28" }
                  - { label: "Medium (36px)", value: "36" }
                  - { label: "Large (48px)", value: "48" }
              - { label: "Link to article / feature (optional)", name: "url", widget: "string", required: false }

          - label: "5 · Media spotlight (video section after Featured Work)"
            name: "media_banner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "heading", widget: "string", hint: "e.g. See Sam in action." }
              - { label: "Supporting text", name: "body", widget: "text" }
              - { label: "Button label", name: "button_label", widget: "string" }
              - { label: "Button link", name: "button_url", widget: "string", hint: "e.g. contact.html, or a YouTube link" }
              - { label: "Fallback image", name: "image", widget: "image", required: false, hint: "Shown while the video loads, and on slow connections / reduced-motion devices." }
              - { label: "Background video", name: "video", widget: "file", required: false, hint: "MP4 under ~20 MB. Plays muted on loop behind the text. Remove to use the image only." }
              - label: "Media — crop focus"
                name: "media_position"
                widget: "select"
                required: false
                default: "center"
                hint: "Which part of the video/image stays visible when cropped. Choose Top to keep faces in frame."
                options:
                  - { label: "Top (keep faces in frame)", value: "top" }
                  - { label: "Centre", value: "center" }
                  - { label: "Bottom", value: "bottom" }
              - label: "Section height"
                name: "section_height"
                widget: "select"
                required: false
                default: "standard"
                hint: "Taller sections show more of the video and crop less."
                options:
                  - { label: "Standard", value: "standard" }
                  - { label: "Tall (≈70% of screen)", value: "tall" }
                  - { label: "Full screen", value: "full" }

          - label: "6 · Closing CTA banner (cinematic section above the footer)"
            name: "cta_banner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline", name: "heading", widget: "string", hint: "e.g. Ready to mobilise your community?" }
              - { label: "Supporting text", name: "body", widget: "text" }
              - { label: "Button label", name: "button_label", widget: "string" }
              - { label: "Button link", name: "button_url", widget: "string", hint: "e.g. contact.html" }
              - { label: "Background image", name: "image", widget: "image", required: false, hint: "Cinematic photo of Sam in action. Also used as the video fallback." }
              - { label: "Background video (optional)", name: "video", widget: "file", required: false, hint: "MP4 under ~20 MB. Plays muted on loop. The image above is the fallback." }
              - label: "Media — crop focus"
                name: "media_position"
                widget: "select"
                required: false
                default: "center"
                hint: "Which part of the video/image stays visible when cropped. Choose Top to keep faces in frame."
                options:
                  - { label: "Top (keep faces in frame)", value: "top" }
                  - { label: "Centre", value: "center" }
                  - { label: "Bottom", value: "bottom" }
              - label: "Section height"
                name: "section_height"
                widget: "select"
                required: false
                default: "standard"
                hint: "Taller sections show more of the video and crop less."
                options:
                  - { label: "Standard", value: "standard" }
                  - { label: "Tall (≈70% of screen)", value: "tall" }
                  - { label: "Full screen", value: "full" }

          - label: "7 · Section headings & copy (rest of the homepage)"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Pull-quote band — quote", name: "quote_band_text", widget: "string" }
              - { label: "Pull-quote band — attribution", name: "quote_band_cite", widget: "string" }
              - { label: "Featured work — section heading", name: "projects_heading", widget: "string", hint: "The project cards themselves are edited under 🏛 Governance / Projects page" }
              - { label: "Testimonials — section heading", name: "testimonials_heading", widget: "string", hint: "The testimonials themselves are edited under 💬 Testimonials" }

  # ════════════════════════════════════════════════════════
  # 📖 ABOUT PAGE
  # ════════════════════════════════════════════════════════
  - name: "about"
    label: "📖 About page"
    description: "Everything on the About page: heading, bio, portrait, quote and the three value cards."
    files:
      - name: "about"
        label: "About page content"
        file: "_data/about.json"
        format: json
        fields:

          - label: "1 · Page header, bio & portrait"
            name: "about_full"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Hero — headline", name: "heading", widget: "string", hint: "Large editorial headline on the left of the hero" }
              - { label: "Hero — supporting intro", name: "subheading", widget: "text" }
              - { label: "Hero — large image (right side)", name: "hero_image", widget: "image", required: false, hint: "Editorial portrait or action shot of Sam. The dominant visual on the page." }
              - label: "Hero image — crop focus"
                name: "hero_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep face in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Origin story heading", name: "origin_heading", widget: "string" }
              - { label: "Origin story body (HTML)", name: "origin_body", widget: "markdown" }
              - { label: "Quote section — quote text", name: "quote", widget: "text", hint: "Displays at huge cinematic scale over the photo — keep it tight. Quote marks are added automatically." }
              - { label: "Quote section — name", name: "quote_cite", widget: "string" }
              - { label: "Quote section — title / role", name: "quote_role", widget: "string", required: false, hint: "e.g. Founder, Student Volunteer Army" }
              - { label: "Quote section — background photo", name: "quote_image", widget: "image", required: false, hint: "Large photo of Sam (speaking, volunteering or strong portrait). Fills the screen behind the quote." }
              - label: "Quote background — crop focus"
                name: "quote_image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Quote section — small profile photo", name: "quote_avatar", widget: "image", required: false, hint: "Circular headshot under the quote" }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Upload or pick from media library to replace." }
              - label: "Portrait — shape / size"
                name: "portrait_aspect"
                widget: "select"
                required: false
                default: "4/5"
                options:
                  - { label: "Portrait 4:5 (default)", value: "4/5" }
                  - { label: "Square 1:1", value: "1/1" }
                  - { label: "Portrait 3:4", value: "3/4" }
                  - { label: "Landscape 16:10", value: "16/10" }
              - label: "Portrait — fit"
                name: "portrait_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Portrait — crop focus"
                name: "portrait_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top (keep head in frame)", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "2 · Values section & page CTA"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Values — section heading", name: "values_heading", widget: "string" }
              - label: "Values — belief cards"
                name: "values"
                widget: "list"
                label_singular: "Value"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body text", name: "body", widget: "text" }
              - { label: "Explore card 1 (Timeline) — heading", name: "hub_timeline_heading", widget: "string", required: false }
              - { label: "Explore card 1 (Timeline) — description", name: "hub_timeline_body", widget: "text", required: false }
              - { label: "Explore card 1 (Timeline) — button label", name: "hub_timeline_button", widget: "string", required: false }
              - { label: "Explore card 1 (Timeline) — background photo", name: "hub_timeline_image", widget: "image", required: false, hint: "Career-journey photo. Fills the card behind the text." }
              - label: "Explore card 1 — crop focus"
                name: "hub_timeline_image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
              - { label: "Explore card 2 (Projects) — heading", name: "hub_projects_heading", widget: "string", required: false }
              - { label: "Explore card 2 (Projects) — description", name: "hub_projects_body", widget: "text", required: false }
              - { label: "Explore card 2 (Projects) — button label", name: "hub_projects_button", widget: "string", required: false }
              - { label: "Explore card 2 (Projects) — background photo", name: "hub_projects_image", widget: "image", required: false, hint: "Work-and-impact photo. Fills the card behind the text." }
              - label: "Explore card 2 — crop focus"
                name: "hub_projects_image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }

  # ════════════════════════════════════════════════════════
  # 🏛 GOVERNANCE / PROJECTS PAGE
  # ════════════════════════════════════════════════════════
  - name: "governance_projects"
    label: "🏛 Governance / Projects page"
    description: "The Governance / Projects page: governance entries, project cards (the first three also appear on the homepage), stat band and page copy."
    files:
      - name: "governance_projects"
        label: "Governance / Projects content"
        file: "_data/governance-projects.json"
        format: json
        fields:

          - label: "1 · Governance entries"
            name: "governance"
            widget: "list"
            collapsed: false
            label_singular: "Governance entry"
            hint: "Board positions, advisory roles, committees. Drag entries to reorder them. The top 4 show by default — the rest sit behind a 'View all governance' button."
            fields:
              - { label: "Role / Title", name: "title", widget: "string", hint: "e.g. Board Member, Trustee, Chair" }
              - { label: "Featured (show in the top group)", name: "featured", widget: "boolean", required: false, default: false, hint: "Featured entries float to the top of the list. The first 4 are visible before 'View all'." }
              - { label: "Organisation / Years", name: "meta", widget: "string", hint: "e.g. Organisation name · 2020 – present" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string", required: false, hint: "e.g. Governance, Advisory, Current" }
              - { label: "Photo (optional)", name: "image", widget: "image", required: false }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "2 · Project cards"
            name: "projects"
            widget: "list"
            collapsed: true
            label_singular: "Project"
            hint: "The first project is the large featured card; the first three also appear on the homepage. The top 5 show by default — the rest sit behind a 'View all projects' button. Drag to reorder."
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Featured (show in the top group)", name: "featured", widget: "boolean", required: false, default: false, hint: "Featured projects float to the top of the list. The first 5 are visible before 'View all'." }
              - { label: "Date / Location", name: "meta", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag", name: "chip", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - label: "Photo — shape / size"
                name: "image_aspect"
                widget: "select"
                required: false
                default: "16/10"
                options:
                  - { label: "Landscape 16:10 (default)", value: "16/10" }
                  - { label: "Landscape 4:3", value: "4/3" }
                  - { label: "Widescreen 16:9", value: "16/9" }
                  - { label: "Square 1:1", value: "1/1" }
              - label: "Photo — fit"
                name: "image_fit"
                widget: "select"
                required: false
                default: "cover"
                options:
                  - { label: "Fill the frame (crops edges)", value: "cover" }
                  - { label: "Show whole photo (may leave gaps)", value: "contain" }
              - label: "Photo — crop focus"
                name: "image_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }

          - label: "3 · Page headings & copy"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page heading", name: "heading", widget: "string" }
              - { label: "Page subheading", name: "subheading", widget: "text" }
              - { label: "Governance — section heading", name: "governance_heading", widget: "string" }
              - { label: "Governance — section intro", name: "governance_intro", widget: "text", required: false }
              - { label: "Projects — section heading", name: "projects_heading", widget: "string" }
              - { label: "Projects — section intro", name: "projects_intro", widget: "text", required: false }
              - { label: "Bottom CTA — heading", name: "cta_heading", widget: "string" }
              - { label: "Bottom CTA — body", name: "cta_body", widget: "text" }
              - { label: "Bottom CTA — button label", name: "cta_button_label", widget: "string", required: false, hint: "Links to the LinkedIn URL set in ⚙️ Site settings" }

  # ════════════════════════════════════════════════════════
  # 📅 EXPERIENCE PAGE
  # ════════════════════════════════════════════════════════
  - name: "experience"
    label: "📅 Experience page"
    description: "The Experience page: career timeline, awards band and page copy."
    files:
      - name: "experience"
        label: "Experience page content"
        file: "_data/experience.json"
        format: json
        fields:

          - label: "1 · Career timeline"
            name: "timeline"
            widget: "list"
            collapsed: false
            label_singular: "Timeline item"
            hint: "Drag items to reorder them on the timeline."
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Tag (optional)", name: "chip", widget: "string", required: false }

          - label: "2 · Recognition & awards showcase"
            name: "awards"
            widget: "list"
            collapsed: true
            label_singular: "Recognition"
            hint: "Premium recognition cards. Drag to reorder. Upload the official organisation logo for each award — PNG/SVG with transparent background works best."
            fields:
              - { label: "Award name", name: "title", widget: "string" }
              - { label: "Card background photo (optional)", name: "image", widget: "image", required: false, hint: "Tall photo behind the card (e.g. from the award ceremony). Without one, a premium dark background is used." }
              - { label: "Organisation logo", name: "logo", widget: "image", required: false, hint: "Official logo of the awarding organisation. Shown above the award name." }
              - label: "Logo size"
                name: "logo_size"
                widget: "select"
                required: false
                default: "56"
                options:
                  - { label: "Small (40px)", value: "40" }
                  - { label: "Medium (56px)", value: "56" }
                  - { label: "Large (72px)", value: "72" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Year received", name: "year", widget: "string", required: false, hint: "e.g. 2012 — leave blank if unconfirmed" }
              - { label: "Link (optional)", name: "url", widget: "string", required: false, hint: "Award page or announcement — adds a 'Learn more' to the card" }

          - label: "3 · Page headings & copy"
            name: "copy"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Hero — headline", name: "heading", widget: "string" }
              - { label: "Hero — supporting text", name: "subheading", widget: "text" }
              - { label: "Hero — background photo", name: "hero_image", widget: "image", required: false, hint: "Full-width photo behind the page header. Text sits over a dark gradient on the left." }
              - label: "Hero image — crop focus"
                name: "hero_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Awards — section heading", name: "awards_heading", widget: "string" }
              - { label: "Bottom CTA — heading", name: "cta_heading", widget: "string" }
              - { label: "Bottom CTA — body", name: "cta_body", widget: "text" }
              - label: "Bottom CTA — background media"
                name: "cta_media"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Background video (optional)", name: "video", widget: "file", required: false, hint: "Short MP4 under ~20 MB. Plays muted on loop behind the text." }
                  - { label: "Fallback image (optional)", name: "image", widget: "image", required: false, hint: "Shown while the video loads and on slow connections. Without either, a deep vermillion background is used." }
                  - label: "Media — crop focus"
                    name: "media_position"
                    widget: "select"
                    required: false
                    default: "center"
                    options:
                      - { label: "Top (keep faces in frame)", value: "top" }
                      - { label: "Centre", value: "center" }
                      - { label: "Bottom", value: "bottom" }

  # ════════════════════════════════════════════════════════
  # ✉️ CONTACT PAGE
  # ════════════════════════════════════════════════════════
  - name: "contact"
    label: "✉️ Contact page"
    description: "The Contact page headings and side panel. The email address itself lives in ⚙️ Site settings."
    files:
      - name: "contact"
        label: "Contact page content"
        file: "_data/contact.json"
        format: json
        fields:
          - label: "Contact page content"
            name: "copy"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Hero — headline", name: "heading", widget: "string", hint: "e.g. How can we help you connect with Sam?" }
              - { label: "Hero — supporting text", name: "subheading", widget: "text" }
              - { label: "Hero — background image", name: "hero_image", widget: "image", required: false, hint: "Full-width photo of Sam speaking / in action" }
              - label: "Hero image — crop focus"
                name: "hero_position"
                widget: "select"
                required: false
                default: "center"
                options:
                  - { label: "Centre", value: "center" }
                  - { label: "Top", value: "top" }
                  - { label: "Bottom", value: "bottom" }
                  - { label: "Left", value: "left" }
                  - { label: "Right", value: "right" }
              - { label: "Enquiry box — placeholder text", name: "enquiry_placeholder", widget: "string", required: false, hint: "e.g. Looking to book Sam for an event?" }
              - { label: "Pathways — section heading", name: "categories_heading", widget: "string", required: false }
              - label: "Pathways — contact categories"
                name: "categories"
                widget: "list"
                label_singular: "Category"
                hint: "The clickable pathway cards. Drag to reorder. Clicking a card pre-selects the enquiry type on the form."
                fields:
                  - { label: "Category name", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "string" }
              - { label: "Form — section heading", name: "form_heading", widget: "string", required: false }
              - { label: "Form — submit button label", name: "submit_label", widget: "string", required: false }
              - { label: "Form — success message", name: "success_message", widget: "string", required: false, hint: "Shown after a successful submission" }
              - { label: "Side panel — heading", name: "aside_heading", widget: "string" }
              - { label: "Side panel — response time note", name: "aside_response_time", widget: "string" }

  # ════════════════════════════════════════════════════════
  # 💬 TESTIMONIALS (homepage carousel)
  # ════════════════════════════════════════════════════════
  - name: "testimonials"
    label: "💬 Testimonials"
    description: "The testimonial carousel on the homepage. Add as many as you like — drag to reorder."
    files:
      - name: "testimonials"
        label: "Testimonials"
        file: "_data/testimonials.json"
        format: json
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            collapsed: false
            label_singular: "Endorsement"
            hint: "The endorsement wall on the homepage. Drag to reorder the profile row — the first endorsement's quote shows when the page loads (Featured floats to the front)."
            fields:
              - { label: "Quote", name: "quote", widget: "text", hint: "Keep it punchy — the quote displays at large editorial size" }
              - { label: "Name", name: "author", widget: "string" }
              - { label: "Title / role", name: "title", widget: "string", hint: "e.g. Former Prime Minister of New Zealand" }
              - { label: "Organisation (optional)", name: "organisation", widget: "string", required: false }
              - { label: "Profile photo", name: "photo", widget: "image", required: false, hint: "Square headshot works best — shown as a circle. Without one, initials show instead." }
              - { label: "Prominent (larger profile)", name: "prominent", widget: "boolean", required: false, default: false, hint: "For especially senior endorsers — shows a larger portrait" }
              - { label: "Featured (show first)", name: "featured", widget: "boolean", required: false, default: false }

  # ════════════════════════════════════════════════════════
  # ⚙️ SITE SETTINGS (name, contact, links — used everywhere)
  # ════════════════════════════════════════════════════════
  - name: "settings"
    label: "⚙️ Site settings"
    description: "Site-wide details used on every page: name, button label, email and social links."
    files:
      - name: "settings"
        label: "Site settings"
        file: "_data/settings.json"
        format: json
        fields:
          - label: "Settings"
            name: "settings"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Your name (site-wide)", name: "name", widget: "string" }
              - { label: "CTA button label", name: "cta_label", widget: "string", hint: "e.g. Book Sam to Speak — appears on all CTA buttons site-wide" }
              - { label: "Contact email", name: "email", widget: "string", hint: "Shown in footer and contact page" }
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
              - { label: "SVA Website URL", name: "sva_url", widget: "string" }
              - { label: "Footer tagline", name: "footer_tagline", widget: "string" }
